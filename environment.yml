# Conda environment specification for the Live PCA Engine.
#
# To create:  conda env create -f environment.yml
# To update:  conda env update -f environment.yml --prune
# To remove:  conda env remove -n live-pca
#
name: live-pca
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=2.0
      - scipy>=1.10
      - opencv-contrib-python>=4.8
      - mediapipe>=1.0
      - panda3d>=1.10.14
      - matplotlib>=3.7
      - scikit-learn>=1.3
      - Pillow>=10.0
      - pytest>=9.0
